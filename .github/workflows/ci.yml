# Build and test every push and every pull request.
#
# Setup, Configure, Build, Test and Install are separate steps in every job,
# so a red mark names which one failed.  "Test" is the mock-libpurple suite in
# test/ (`run-tests`): no account, no network.  "Install" is `ninja install`
# into a scratch DESTDIR, which catches a broken install rule.
# .github/annotate.sh repeats the tail of a failing step's output as an
# annotation, and the last job ("Summary") lays every job's outcomes out as
# one table at the top of the run's page.  CodeQL is a workflow of its own
# (codeql.yml).
#
# Every platform supplies its own TDLib.  Linux runs in a Gentoo container,
# on x86-64 and on arm64, as Gentoo follows TDLib upstream closely (Ubuntu
# has no TDLib package; Fedora's predates the API this code uses).  Gentoo builds TDLib from source, the first time and after each new
# release; .github/gentoo-setup.sh explains how it is kept.  The BSDs run in
# a VM on a Linux runner, through cross-platform-actions; every step after
# the one that boots the VM runs inside it (shell: cpa.sh).  OpenBSD is
# experimental: its failures are shown but do not fail the workflow.  NetBSD
# (no TDLib package) and DragonFly (a TDLib that predates 1.8.6) are left out
# until they have one.  None of these offers a 32-bit x86 TDLib.
#
# No -Werror: clang finds an unused private field (transceiver.h) that gcc
# does not, and the warnings are in the log anyway.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WARNINGS: >-
    -Wall -Wextra -Wformat=2 -Wformat-signedness
    -Wno-unused-parameter -Wno-parentheses

jobs:
  lint:
    name: Translations (lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Not every translation needs every accelerator the linter knows of:
      # it is only told to check those a translation has.
      - name: Lint accelerators
        id: lint
        env:
          LINTACCEL_IGNORE_MISSING: y
        run: sh .github/annotate.sh Lint python3 po/lint_accelerators.py

      - name: Record outcome
        if: always()
        env:
          ORDER: 20
          NAME: Translations (lint)
          SETUP: success
          CONFIGURE: n/a
          BUILD: n/a
          TEST: ${{ steps.lint.outcome }}
          INSTALL: n/a
        run: sh .github/record.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: outcome-${{ github.job }}
          path: outcome.tsv

  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: gentoo/stage3:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Gentoo (g++)
            runner: ubuntu-24.04
            cxx: g++
            packages: ''
            options: ''
          - name: Gentoo (clang++)
            runner: ubuntu-24.04
            cxx: clang++
            packages: llvm-core/clang
            options: ''
          - name: Gentoo (g++, NoTranslations)
            runner: ubuntu-24.04
            cxx: g++
            packages: ''
            options: -DNoTranslations=1
          - name: Gentoo arm64 (g++)
            runner: ubuntu-24.04-arm
            cxx: g++
            packages: ''
            options: ''
    steps:
      # No git in the container yet: this fetches a tarball instead.
      - uses: actions/checkout@v7

      # What this or an earlier run built from source (TDLib, libpurple).
      - uses: actions/cache/restore@v4
        with:
          path: /var/cache/binpkgs
          key: gentoo-binpkgs-${{ runner.arch }}-
          restore-keys: gentoo-binpkgs-${{ runner.arch }}-

      - name: Install dependencies
        id: install
        run: >-
          sh .github/annotate.sh Setup
          sh .github/gentoo-setup.sh ${{ matrix.packages }}

      # Named after what it holds, so an unchanged set is not saved again.
      - name: Name the package cache
        id: binpkgs
        if: steps.install.outcome == 'success'
        run: >-
          echo "key=gentoo-binpkgs-${{ runner.arch }}-$(find /var/cache/binpkgs
          -type f -name '*.gpkg.tar' | sort | sha256sum | cut -c1-16)"
          >> "$GITHUB_OUTPUT"

      - uses: actions/cache/save@v4
        if: steps.install.outcome == 'success'
        continue-on-error: true
        with:
          path: /var/cache/binpkgs
          key: ${{ steps.binpkgs.outputs.key }}

      - name: Configure
        id: configure
        env:
          CXX: ${{ matrix.cxx }}
        run: >-
          sh .github/annotate.sh Configure
          cmake -G Ninja -S . -B build -DNoVoip=1 ${{ matrix.options }}
          -DCMAKE_CXX_FLAGS="${{ env.WARNINGS }}"

      - name: Build
        id: build
        run: >-
          sh .github/annotate.sh Build
          cmake --build build --target all tests

      - name: Test
        id: test
        run: sh .github/annotate.sh Test cmake --build build --target run-tests

      - name: Install
        id: destdir
        run: >-
          sh .github/annotate.sh Install
          env DESTDIR="$PWD/destdir" cmake --build build --target install
          && find destdir -type f

      - name: Record outcome
        if: always()
        env:
          ORDER: 0${{ strategy.job-index }}
          NAME: ${{ matrix.name }}
          SETUP: ${{ steps.install.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
          INSTALL: ${{ steps.destdir.outcome }}
        run: sh .github/record.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: outcome-${{ github.job }}-${{ strategy.job-index }}
          path: outcome.tsv

  bsd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: FreeBSD 15.1
            os: freebsd
            version: '15.1'
            experimental: false
            prefix: /usr/local
            options: ''
            install: >-
              sudo pkg install -y cmake ninja pkgconf gettext-tools
              libpurple tdlib libfmt rlottie webp png googletest
          - name: FreeBSD 14.4
            os: freebsd
            version: '14.4'
            experimental: false
            prefix: /usr/local
            options: ''
            install: >-
              sudo pkg install -y cmake ninja pkgconf gettext-tools
              libpurple tdlib libfmt rlottie webp png googletest
          # No rlottie package, so no animated stickers.
          - name: OpenBSD 7.9 (experimental, NoLottie)
            os: openbsd
            version: '7.9'
            experimental: true
            prefix: /usr/local
            options: -DNoLottie=1
            install: >-
              sudo pkg_add -I cmake ninja gettext-tools libpurple tdlib fmt
              libwebp png gtest
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v7

      - name: Boot ${{ matrix.name }}
        id: boot
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}

      - name: Install dependencies
        id: install
        run: ${{ matrix.install }}

      # The packages live under ${prefix}, which the compiler and linker do
      # not search by themselves (gtest, fmt, libintl); the ports tree's
      # USES=localbase does the same.  CMakeLists.txt resets the linker
      # flags, so the search paths go in the environment (CPATH,
      # LIBRARY_PATH) -- and, as nothing from the runner reaches the VM
      # except through the command line, `env` sets them, and ${{ }} is
      # expanded before the command is sent.
      - name: Configure
        id: configure
        run: >-
          sh .github/annotate.sh Configure
          env CPATH=${{ matrix.prefix }}/include
          LIBRARY_PATH=${{ matrix.prefix }}/lib
          PKG_CONFIG_PATH=${{ matrix.prefix }}/lib/pkgconfig:${{ matrix.prefix }}/libdata/pkgconfig
          cmake -G Ninja -S . -B build -DNoVoip=1 ${{ matrix.options }}
          -DCMAKE_PREFIX_PATH=${{ matrix.prefix }}
          -DCMAKE_CXX_FLAGS="${{ env.WARNINGS }}"

      - name: Build
        id: build
        run: >-
          sh .github/annotate.sh Build
          env CPATH=${{ matrix.prefix }}/include
          LIBRARY_PATH=${{ matrix.prefix }}/lib
          cmake --build build --target all tests

      - name: Test
        id: test
        run: >-
          sh .github/annotate.sh Test
          env LD_LIBRARY_PATH=${{ matrix.prefix }}/lib
          cmake --build build --target run-tests

      - name: Install
        id: destdir
        run: >-
          sh .github/annotate.sh Install
          env DESTDIR="$PWD/destdir" cmake --build build --target install
          && find destdir -type f

      # On the runner, not in the VM: it may never have booted.
      - name: Record outcome
        if: always()
        shell: bash
        env:
          ORDER: 1${{ strategy.job-index }}
          NAME: ${{ matrix.name }}
          SETUP: ${{ steps.boot.outcome }} ${{ steps.install.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
          INSTALL: ${{ steps.destdir.outcome }}
        run: sh .github/record.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: outcome-${{ github.job }}-${{ strategy.job-index }}
          path: outcome.tsv

  summary:
    name: Summary
    needs: [lint, linux, bsd]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: outcome-*
          merge-multiple: false
          path: outcomes

      - name: Tabulate
        run: sh .github/summary.sh outcomes >> "$GITHUB_STEP_SUMMARY"
