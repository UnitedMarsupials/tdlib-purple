# Build and test every push and every pull request.
#
# Setup, Configure, Build and Test are separate steps in every job, so a red
# mark names which one failed.  "Test" is the mock-libpurple suite in test/
# (`run-tests`): no account, no network.  .github/annotate.sh repeats the tail
# of a failing step's output as an annotation, and the last job ("Summary")
# lays every job's outcomes out as one table at the top of the run's page.
#
# TDLib is not built here; every platform installs its own package of it.
# Linux runs in a Debian container, since Ubuntu 24.04 has no libtd-dev.  The
# BSDs run in a VM on a Linux runner, through cross-platform-actions; every
# step after the one that boots the VM runs inside it (shell: cpa.sh).
# OpenBSD, NetBSD and DragonFly are experimental: their failures are shown
# but do not fail the workflow.
#
# No -Werror: clang finds an unused private field (transceiver.h) that gcc
# does not, and the warnings are in the log anyway.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WARNINGS: -Wall -Wextra -Wformat=2 -Wno-unused-parameter -Wno-parentheses

jobs:
  linux:
    name: Debian 13 (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        include:
          - cxx: g++
            compiler: g++
          - cxx: clang++
            compiler: clang
    steps:
      - name: Install dependencies
        id: install
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
              ca-certificates git cmake ninja-build pkg-config gettext \
              ${{ matrix.compiler }} \
              libpurple-dev libtd-dev libfmt-dev librlottie-dev \
              libwebp-dev libpng-dev zlib1g-dev libgtest-dev

      - uses: actions/checkout@v7

      - name: Configure
        id: configure
        env:
          CXX: ${{ matrix.cxx }}
        run: >-
          sh .github/annotate.sh Configure
          cmake -G Ninja -S . -B build -DNoVoip=1
          -DCMAKE_CXX_FLAGS="${{ env.WARNINGS }}"

      - name: Build
        id: build
        run: >-
          sh .github/annotate.sh Build
          cmake --build build --target all tests

      - name: Test
        id: test
        run: sh .github/annotate.sh Test cmake --build build --target run-tests

      - name: Record outcome
        if: always()
        env:
          ORDER: 0${{ strategy.job-index }}
          NAME: Debian 13 (${{ matrix.cxx }})
          SETUP: ${{ steps.install.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: sh .github/record.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: outcome-${{ github.job }}-${{ strategy.job-index }}
          path: outcome.tsv

  bsd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: FreeBSD 15.1
            os: freebsd
            version: '15.1'
            experimental: false
            prefix: /usr/local
            install: >-
              sudo pkg install -y cmake ninja pkgconf gettext-tools
              libpurple tdlib libfmt rlottie webp png googletest
          - name: FreeBSD 14.4
            os: freebsd
            version: '14.4'
            experimental: false
            prefix: /usr/local
            install: >-
              sudo pkg install -y cmake ninja pkgconf gettext-tools
              libpurple tdlib libfmt rlottie webp png googletest
          - name: OpenBSD 7.9 (experimental)
            os: openbsd
            version: '7.9'
            experimental: true
            prefix: /usr/local
            install: >-
              sudo pkg_add -I cmake ninja gettext-tools libpurple tdlib fmt
              rlottie libwebp png gtest
          - name: NetBSD 10.1 (experimental)
            os: netbsd
            version: '10.1'
            experimental: true
            prefix: /usr/pkg
            install: >-
              sudo pkgin -y install cmake ninja pkgconf gettext-tools
              libpurple tdlib fmt rlottie libwebp png googletest
          - name: DragonFly BSD 6.4 (experimental)
            os: dragonflybsd
            version: '6.4.2'
            experimental: true
            prefix: /usr/local
            install: >-
              sudo pkg install -y cmake ninja pkgconf gettext-tools
              libpurple tdlib libfmt rlottie webp png googletest
    defaults:
      run:
        shell: cpa.sh {0}
    steps:
      - uses: actions/checkout@v7

      - name: Boot ${{ matrix.name }}
        id: boot
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}

      - name: Install dependencies
        id: install
        run: ${{ matrix.install }}

      # The packages live under ${prefix}, which the compiler and linker do
      # not search by themselves (gtest, fmt, libintl); the ports tree's
      # USES=localbase does the same.  CMakeLists.txt resets the linker
      # flags, so the search paths go in the environment (CPATH,
      # LIBRARY_PATH) -- and, as nothing from the runner reaches the VM
      # except through the command line, `env` sets them, and ${{ }} is
      # expanded before the command is sent.
      - name: Configure
        id: configure
        run: >-
          sh .github/annotate.sh Configure
          env CPATH=${{ matrix.prefix }}/include
          LIBRARY_PATH=${{ matrix.prefix }}/lib
          PKG_CONFIG_PATH=${{ matrix.prefix }}/lib/pkgconfig:${{ matrix.prefix }}/libdata/pkgconfig
          cmake -G Ninja -S . -B build -DNoVoip=1
          -DCMAKE_PREFIX_PATH=${{ matrix.prefix }}
          -DCMAKE_CXX_FLAGS="${{ env.WARNINGS }}"

      - name: Build
        id: build
        run: >-
          sh .github/annotate.sh Build
          env CPATH=${{ matrix.prefix }}/include
          LIBRARY_PATH=${{ matrix.prefix }}/lib
          cmake --build build --target all tests

      - name: Test
        id: test
        run: >-
          sh .github/annotate.sh Test
          env LD_LIBRARY_PATH=${{ matrix.prefix }}/lib
          cmake --build build --target run-tests

      # On the runner, not in the VM: it may never have booted.
      - name: Record outcome
        if: always()
        shell: bash
        env:
          ORDER: 1${{ strategy.job-index }}
          NAME: ${{ matrix.name }}
          SETUP: ${{ steps.boot.outcome }} ${{ steps.install.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: sh .github/record.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: outcome-${{ github.job }}-${{ strategy.job-index }}
          path: outcome.tsv

  summary:
    name: Summary
    needs: [linux, bsd]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: outcome-*
          merge-multiple: false
          path: outcomes

      - name: Tabulate
        run: sh .github/summary.sh outcomes >> "$GITHUB_STEP_SUMMARY"
