name: "tdlib-purple CodeQL config"

# The security queries only, the taint and data-flow analysis.  Without a
# build, CodeQL cannot resolve what the headers of GTK, Pidgin, libpurple and
# TDLib declare, and the quality queries of security-and-quality then misread
# the code: locals of a function using those types as globals, their
# initializations as expressions with no effect, the td of td::td_api as a
# variable hiding others, a switch over td_api's ::ID constants as having one
# case.  That was all they found, but for a comment or two.
queries:
  - uses: security-extended

# The mock libpurple and the test cases are not shipped.  (For C++ this can
# only work in build mode "none", as the workflow runs; a traced build
# analyses whatever it compiles.)
paths-ignore:
  - test

# Documentation for configuring CodeQL:
# https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
